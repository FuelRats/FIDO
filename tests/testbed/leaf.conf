/* The leaf, which links to the hub on its own and relinks after every drop. */
me {
	name "leaf.irc.example.test";
	info "FIDO test bed leaf";
	sid "002";
}

include "common.conf";

link hub.irc.example.test {
	outgoing {
		hostname hub.irc.example.test;
		port 6900;
		options { tls; autoconnect; }
	}
	password "@LINK_PASSWORD@";
	hub *;
	class servers;
}
