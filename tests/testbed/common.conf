/* Shared by hub.conf and leaf.conf. ircd-entrypoint.sh fills the @...@ placeholders. */
include "modules.default.conf";
include "operclass.default.conf";
include "snomasks.default.conf";
loadmodule "cloak_sha256";

admin {
	"FIDO test bed";
	"admin@irc.example.test";
}

class clients { pingfreq 90; maxclients 100; sendq 200k; recvq 8000; }
class opers { pingfreq 90; maxclients 20; sendq 1M; recvq 8000; }
class servers { pingfreq 60; connfreq 5; maxclients 5; sendq 20M; }

allow {
	mask *;
	class clients;
	maxperip 10;
}

listen { ip *; port 6697; options { tls; } }
listen { ip *; port 6900; options { tls; serversonly; } }

/* A bot operclass in the spirit of prod's botop: G-lines and SAJOIN, no channel override. */
operclass botop {
	permissions {
		chat;
		channel { see; }
		client;
		immune;
		self { opermodes; set; }
		kill;
		server-ban { gline; zline; shun; }
		sacmd { sajoin; }
	}
}

/* FIDO's oper block, with prod's snomask. 198.51.100.0/24 is the test bed's Docker network. */
oper fido-testbed {
	class opers;
	mask 198.51.100.0/24;
	password "@FIDO_OPER_PASSWORD@";
	operclass botop;
	snomask "+bcdfkoqsBCOS";
}

/* The test client's oper block, for /KILL. */
oper testop {
	class opers;
	mask 198.51.100.0/24;
	password "@TESTOP_PASSWORD@";
	operclass netadmin;
}

/* FIDO reconnects after every restart test, faster than the default connect-flood allows. */
except throttle {
	mask *;
}

set {
	network-name "Example";
	default-server "hub.irc.example.test";
	help-channel "#help";
	kline-address "admin@irc.example.test";
	cloak-prefix "Clk";
	cloak-keys {
		"@CLOAK_KEY_1@";
		"@CLOAK_KEY_2@";
		"@CLOAK_KEY_3@";
	}
	tls {
		certificate "/certs/@ROLE@.pem";
		key "/certs/@ROLE@.key";
	}
}
